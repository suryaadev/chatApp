apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-chat-deployment
  namespace: chat-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend-pod
      namespace: chat-ns
      labels:
        app: backend
    spec:
      containers:
        - name: chat-backend
          image: kartoos21/chat-app-backend:latest
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              value: "production"

            - name: MONGODB_URI
              #value: "mongodb://mongodb:27017/chat-db"
              value: "mongodb://root:admin@mongodb:27017/chat-db?authSource=admin"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-app-secret
                  key: jwt
            - name: PORT
              value: "5001"
